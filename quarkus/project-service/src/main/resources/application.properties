quarkus.application.name=project-service
quarkus.http.port=${PROJECT_SERVICE_PORT:8086}

quarkus.log.console.json.enabled=${LOG_JSON_ENABLED:false}
quarkus.micrometer.export.prometheus.enabled=${METRICS_PROMETHEUS_ENABLED:true}

messaging.enabled=${MESSAGING_ENABLED:false}
outbox.publisher.enabled=${OUTBOX_PUBLISHER_ENABLED:false}
outbox.batch-size=${OUTBOX_BATCH_SIZE:25}
outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:5}
outbox.poll.interval=${OUTBOX_POLL_INTERVAL:10s}
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
quarkus.kafka.devservices.enabled=${KAFKA_DEV_SERVICES_ENABLED:false}
mp.messaging.outgoing.project-events-out.enabled=${MESSAGING_ENABLED:false}
mp.messaging.outgoing.project-events-out.connector=smallrye-kafka
mp.messaging.outgoing.project-events-out.topic=${KAFKA_PROJECT_EVENTS_TOPIC:javanc.project.events}
mp.messaging.outgoing.project-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.notification-commands-out.enabled=${MESSAGING_ENABLED:false}
mp.messaging.outgoing.notification-commands-out.connector=smallrye-kafka
mp.messaging.outgoing.notification-commands-out.topic=${KAFKA_NOTIFICATION_COMMANDS_TOPIC:javanc.notification.commands}
mp.messaging.outgoing.notification-commands-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${MYSQL_USERNAME:root}
quarkus.datasource.password=${MYSQL_PASSWORD:}
quarkus.datasource.jdbc.url=${PROJECT_MYSQL_JDBC_URL:jdbc:mysql://localhost:3306/project1?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false&allowPublicKeyRetrieval=true}
quarkus.hibernate-orm.schema-management.strategy=${PROJECT_DB_GENERATION:update}
quarkus.hibernate-orm.log.sql=${PROJECT_DB_LOG_SQL:false}

services.image.url=${IMAGE_SERVICE_URL:http://localhost:8083}
services.profile.url=${PROFILE_SERVICE_URL:http://localhost:8085}
services.user.url=${USER_SERVICE_URL:http://localhost:8088}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8084}

quarkus.rest-client.image-service.url=${IMAGE_SERVICE_URL:http://localhost:8083}
quarkus.rest-client.image-service.connect-timeout=${DOWNSTREAM_CONNECT_TIMEOUT:1000}
quarkus.rest-client.image-service.read-timeout=${DOWNSTREAM_READ_TIMEOUT:3000}
quarkus.rest-client.profile-service.url=${PROFILE_SERVICE_URL:http://localhost:8085}
quarkus.rest-client.profile-service.connect-timeout=${DOWNSTREAM_CONNECT_TIMEOUT:1000}
quarkus.rest-client.profile-service.read-timeout=${DOWNSTREAM_READ_TIMEOUT:3000}
quarkus.rest-client.user-service.url=${USER_SERVICE_URL:http://localhost:8088}
quarkus.rest-client.user-service.connect-timeout=${DOWNSTREAM_CONNECT_TIMEOUT:1000}
quarkus.rest-client.user-service.read-timeout=${DOWNSTREAM_READ_TIMEOUT:3000}
quarkus.rest-client.notification-service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8084}
quarkus.rest-client.notification-service.connect-timeout=${DOWNSTREAM_CONNECT_TIMEOUT:1000}
quarkus.rest-client.notification-service.read-timeout=${DOWNSTREAM_READ_TIMEOUT:3000}

%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.health.enabled=false
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:project_service;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.messaging.enabled=false
%test.outbox.publisher.enabled=false
%test.quarkus.kafka.devservices.enabled=false

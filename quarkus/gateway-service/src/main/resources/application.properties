quarkus.application.name=gateway-service
quarkus.http.port=${GATEWAY_SERVICE_PORT:8080}

quarkus.log.category."com.javanc.gateway".level=${GATEWAY_LOG_LEVEL:DEBUG}

quarkus.http.cors.enabled=false
quarkus.http.cors.origins=${GATEWAY_CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:3000,http://127.0.0.1:3000}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS,HEAD
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,origin,access-control-request-method,access-control-request-headers
quarkus.http.cors.exposed-headers=authorization,content-type,x-ratelimit-limit,x-ratelimit-remaining,x-ratelimit-reset,retry-after
quarkus.http.cors.access-control-allow-credentials=true

gateway.cors.origins=${GATEWAY_CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:3000,http://127.0.0.1:3000}
gateway.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS,HEAD
gateway.cors.headers=accept,authorization,content-type,x-requested-with,origin,access-control-request-method,access-control-request-headers
gateway.cors.exposed-headers=authorization,content-type,x-ratelimit-limit,x-ratelimit-remaining,x-ratelimit-reset,retry-after

quarkus.http.limits.max-body-size=${GATEWAY_MAX_BODY_SIZE:20M}

gateway.auth.protected-prefixes=${GATEWAY_AUTH_PROTECTED_PREFIXES:/users,/profiles,/project,/manager}
gateway.request-timeout-millis=${GATEWAY_REQUEST_TIMEOUT_MILLIS:10000}
gateway.auth-timeout-millis=${GATEWAY_AUTH_TIMEOUT_MILLIS:5000}

rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
rate-limit.default.capacity=${RATE_LIMIT_DEFAULT_CAPACITY:120}
rate-limit.default.refill-tokens=${RATE_LIMIT_DEFAULT_REFILL_TOKENS:120}
rate-limit.default.refill-period-seconds=${RATE_LIMIT_DEFAULT_REFILL_PERIOD_SECONDS:60}
rate-limit.auth.capacity=${RATE_LIMIT_AUTH_CAPACITY:10}
rate-limit.auth.refill-tokens=${RATE_LIMIT_AUTH_REFILL_TOKENS:10}
rate-limit.auth.refill-period-seconds=${RATE_LIMIT_AUTH_REFILL_PERIOD_SECONDS:60}
rate-limit.upload.capacity=${RATE_LIMIT_UPLOAD_CAPACITY:20}
rate-limit.upload.refill-tokens=${RATE_LIMIT_UPLOAD_REFILL_TOKENS:20}
rate-limit.upload.refill-period-seconds=${RATE_LIMIT_UPLOAD_REFILL_PERIOD_SECONDS:300}
rate-limit.message.capacity=${RATE_LIMIT_MESSAGE_CAPACITY:30}
rate-limit.message.refill-tokens=${RATE_LIMIT_MESSAGE_REFILL_TOKENS:30}
rate-limit.message.refill-period-seconds=${RATE_LIMIT_MESSAGE_REFILL_PERIOD_SECONDS:60}

services.user.url=${USER_SERVICE_URL:http://localhost:8088}
services.profile.url=${PROFILE_SERVICE_URL:http://localhost:8085}
services.project.url=${PROJECT_SERVICE_URL:http://localhost:8086}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8084}
services.manager.url=${MANAGER_SERVICE_URL:http://localhost:8091}
services.image.url=${IMAGE_SERVICE_URL:http://localhost:8083}
services.email.url=${EMAIL_SERVICE_URL:http://localhost:8087}
services.profile-hr.url=${PROFILE_HR_SERVICE_URL:}

%test.services.user.url=http://user-service.test
%test.services.profile.url=http://profile-service.test
%test.services.project.url=http://project-service.test
%test.services.notification.url=http://notification-service.test
%test.services.manager.url=http://manager-service.test
%test.services.image.url=http://image-service.test
%test.services.email.url=http://email-service.test
%test.services.profile-hr.url=
%test.gateway.auth.protected-prefixes=/users,/profiles,/project,/manager
%test.rate-limit.enabled=false

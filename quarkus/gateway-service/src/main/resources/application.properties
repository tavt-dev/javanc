quarkus.application.name=gateway-service
quarkus.http.port=${GATEWAY_SERVICE_PORT:8080}

quarkus.log.category."com.javanc.gateway".level=${GATEWAY_LOG_LEVEL:DEBUG}

quarkus.http.cors.enabled=false
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS,HEAD
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,origin,access-control-request-method,access-control-request-headers
quarkus.http.cors.exposed-headers=authorization,content-type
quarkus.http.cors.access-control-allow-credentials=true

gateway.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS,HEAD
gateway.cors.headers=accept,authorization,content-type,x-requested-with,origin,access-control-request-method,access-control-request-headers
gateway.cors.exposed-headers=authorization,content-type

quarkus.http.limits.max-body-size=${GATEWAY_MAX_BODY_SIZE:20M}
quarkus.redis.health.enabled=false

gateway.auth.protected-prefixes=${GATEWAY_AUTH_PROTECTED_PREFIXES:/users,/profiles,/project,/manager}
gateway.request-timeout-millis=${GATEWAY_REQUEST_TIMEOUT_MILLIS:10000}
gateway.auth-timeout-millis=${GATEWAY_AUTH_TIMEOUT_MILLIS:5000}

rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
rate-limit.mode=${RATE_LIMIT_MODE:shadow}
rate-limit.fail-open=${RATE_LIMIT_FAIL_OPEN:true}
rate-limit.key-secret=${RATE_LIMIT_KEY_SECRET:change-me-rate-limit-secret}

gateway.rate-limit.trusted-proxy-cidrs=${GATEWAY_RATE_LIMIT_TRUSTED_PROXY_CIDRS:}
gateway.rate-limit.auth-public.capacity=${GATEWAY_RATE_LIMIT_AUTH_PUBLIC_CAPACITY:60}
gateway.rate-limit.public-read.capacity=${GATEWAY_RATE_LIMIT_PUBLIC_READ_CAPACITY:180}
gateway.rate-limit.public-write.capacity=${GATEWAY_RATE_LIMIT_PUBLIC_WRITE_CAPACITY:30}
gateway.rate-limit.public-upload.capacity=${GATEWAY_RATE_LIMIT_PUBLIC_UPLOAD_CAPACITY:10}
gateway.rate-limit.authenticated-default.ip-capacity=${GATEWAY_RATE_LIMIT_AUTHENTICATED_DEFAULT_IP_CAPACITY:600}
gateway.rate-limit.authenticated-default.user-capacity=${GATEWAY_RATE_LIMIT_AUTHENTICATED_DEFAULT_USER_CAPACITY:300}
gateway.rate-limit.authenticated-upload.ip-capacity=${GATEWAY_RATE_LIMIT_AUTHENTICATED_UPLOAD_IP_CAPACITY:60}
gateway.rate-limit.authenticated-upload.user-capacity=${GATEWAY_RATE_LIMIT_AUTHENTICATED_UPLOAD_USER_CAPACITY:20}

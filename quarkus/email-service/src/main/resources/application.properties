quarkus.application.name=email-service
quarkus.http.port=${EMAIL_SERVICE_PORT:8087}
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
quarkus.redis.timeout=${REDIS_TIMEOUT:2s}
quarkus.redis.health.enabled=${REDIS_HEALTH_ENABLED:false}

rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
rate-limit.backend=${RATE_LIMIT_BACKEND:memory}
rate-limit.redis.failure-mode=${RATE_LIMIT_REDIS_FAILURE_MODE:open}
rate-limit.default.capacity=${RATE_LIMIT_DEFAULT_CAPACITY:600}
rate-limit.default.refill-tokens=${RATE_LIMIT_DEFAULT_REFILL_TOKENS:600}
rate-limit.default.refill-period-seconds=${RATE_LIMIT_DEFAULT_REFILL_PERIOD_SECONDS:60}
rate-limit.auth.capacity=${RATE_LIMIT_AUTH_CAPACITY:120}
rate-limit.auth.refill-tokens=${RATE_LIMIT_AUTH_REFILL_TOKENS:120}
rate-limit.auth.refill-period-seconds=${RATE_LIMIT_AUTH_REFILL_PERIOD_SECONDS:60}
rate-limit.upload.capacity=${RATE_LIMIT_UPLOAD_CAPACITY:60}
rate-limit.upload.refill-tokens=${RATE_LIMIT_UPLOAD_REFILL_TOKENS:60}
rate-limit.upload.refill-period-seconds=${RATE_LIMIT_UPLOAD_REFILL_PERIOD_SECONDS:300}
rate-limit.message.capacity=${RATE_LIMIT_MESSAGE_CAPACITY:180}
rate-limit.message.refill-tokens=${RATE_LIMIT_MESSAGE_REFILL_TOKENS:180}
rate-limit.message.refill-period-seconds=${RATE_LIMIT_MESSAGE_REFILL_PERIOD_SECONDS:60}

services.user.url=${USER_SERVICE_URL:http://localhost:8088}
quarkus.rest-client.user-service.url=${USER_SERVICE_URL:http://localhost:8088}

quarkus.mailer.host=${MAIL_HOST:smtp.gmail.com}
quarkus.mailer.port=${MAIL_PORT:587}
quarkus.mailer.username=${MAIL_USERNAME:}
quarkus.mailer.password=${MAIL_PASSWORD:}
quarkus.mailer.from=${MAIL_FROM:}
quarkus.mailer.start-tls=${MAIL_START_TLS:REQUIRED}
quarkus.mailer.login=${MAIL_LOGIN:REQUIRED}
quarkus.mailer.mock=${MAIL_MOCK:false}
mail.timeout-millis=${MAIL_TIMEOUT_MILLIS:5000}

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
email.kafka.group-id=${EMAIL_KAFKA_GROUP_ID:email-service-group}
email.kafka.idempotency.ttl-seconds=${EMAIL_KAFKA_IDEMPOTENCY_TTL_SECONDS:86400}
email.kafka.idempotency.failure-mode=${EMAIL_KAFKA_IDEMPOTENCY_FAILURE_MODE:open}

mp.messaging.incoming.email-commands.enabled=${EMAIL_KAFKA_ENABLED:false}
mp.messaging.incoming.email-commands.connector=smallrye-kafka
mp.messaging.incoming.email-commands.topic=${EMAIL_COMMAND_TOPIC:javanc.email.command.v1}
mp.messaging.incoming.email-commands.group.id=${EMAIL_KAFKA_GROUP_ID:email-service-group}
mp.messaging.incoming.email-commands.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.email-commands.auto.offset.reset=earliest
mp.messaging.incoming.email-commands.failure-strategy=dead-letter-queue
mp.messaging.incoming.email-commands.dead-letter-queue.topic=${EMAIL_COMMAND_DLT_TOPIC:javanc.email.command.v1.dlt}

%test.quarkus.mailer.mock=true
%test.quarkus.mailer.from=test@example.test
%test.rate-limit.enabled=false
%test.rate-limit.backend=memory
%test.quarkus.redis.devservices.enabled=false
%test.mp.messaging.incoming.email-commands.enabled=false

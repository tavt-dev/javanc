quarkus.application.name=email-service
quarkus.http.port=${EMAIL_SERVICE_PORT:8087}

quarkus.log.console.json.enabled=${LOG_JSON_ENABLED:false}
quarkus.micrometer.export.prometheus.enabled=${METRICS_PROMETHEUS_ENABLED:true}

messaging.enabled=${MESSAGING_ENABLED:false}
kafka.consumer.side-effects.enabled=${KAFKA_CONSUMER_SIDE_EFFECTS_ENABLED:false}
kafka.dlq.enabled=${KAFKA_DLQ_ENABLED:false}
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
quarkus.kafka.devservices.enabled=${KAFKA_DEV_SERVICES_ENABLED:false}
mp.messaging.incoming.email-commands-in.enabled=${MESSAGING_ENABLED:false}
mp.messaging.incoming.email-commands-in.connector=smallrye-kafka
mp.messaging.incoming.email-commands-in.topic=${KAFKA_EMAIL_COMMANDS_TOPIC:javanc.email.commands}
mp.messaging.incoming.email-commands-in.group.id=${EMAIL_KAFKA_GROUP_ID:email-service-group}
mp.messaging.incoming.email-commands-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.outgoing.email-commands-dlq-out.enabled=${KAFKA_DLQ_ENABLED:false}
mp.messaging.outgoing.email-commands-dlq-out.connector=smallrye-kafka
mp.messaging.outgoing.email-commands-dlq-out.topic=${KAFKA_EMAIL_COMMANDS_DLQ_TOPIC:javanc.email.commands.dlq}
mp.messaging.outgoing.email-commands-dlq-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${MYSQL_USERNAME:root}
quarkus.datasource.password=${MYSQL_PASSWORD:}
quarkus.datasource.jdbc.url=${EMAIL_MYSQL_JDBC_URL:jdbc:mysql://localhost:3306/email?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
quarkus.hibernate-orm.schema-management.strategy=${EMAIL_DB_SCHEMA_STRATEGY:validate}
quarkus.hibernate-orm.log.sql=${EMAIL_DB_LOG_SQL:false}
quarkus.flyway.migrate-at-start=${EMAIL_DB_MIGRATE:true}
quarkus.flyway.baseline-on-migrate=${EMAIL_DB_BASELINE_ON_MIGRATE:false}
%dev.quarkus.flyway.baseline-on-migrate=${EMAIL_DB_BASELINE_ON_MIGRATE:true}

services.user.url=${USER_SERVICE_URL:http://localhost:8088}
quarkus.rest-client.user-service.url=${USER_SERVICE_URL:http://localhost:8088}
quarkus.rest-client.user-service.connect-timeout=${DOWNSTREAM_CONNECT_TIMEOUT:1000}
quarkus.rest-client.user-service.read-timeout=${DOWNSTREAM_READ_TIMEOUT:3000}

quarkus.mailer.host=${MAIL_HOST:smtp.gmail.com}
quarkus.mailer.port=${MAIL_PORT:587}
quarkus.mailer.username=${MAIL_USERNAME:}
quarkus.mailer.password=${MAIL_PASSWORD:}
quarkus.mailer.from=${MAIL_FROM:}
quarkus.mailer.start-tls=${MAIL_START_TLS:REQUIRED}
quarkus.mailer.login=${MAIL_LOGIN:REQUIRED}
quarkus.mailer.mock=${MAIL_MOCK:false}
mail.timeout-millis=${MAIL_TIMEOUT_MILLIS:5000}

email.kafka.group-id=${EMAIL_KAFKA_GROUP_ID:email-service-group}

%test.quarkus.mailer.mock=true
%test.quarkus.mailer.from=test@example.test
%test.quarkus.datasource.health.enabled=false
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:email_service;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
%test.quarkus.hibernate-orm.schema-management.strategy=validate
%test.quarkus.flyway.migrate-at-start=true
%test.messaging.enabled=false
%test.quarkus.kafka.devservices.enabled=false

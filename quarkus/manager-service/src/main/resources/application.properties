quarkus.application.name=manager-service
quarkus.http.port=${MANAGER_SERVICE_PORT:8091}

outbox.batch-size=${OUTBOX_BATCH_SIZE:25}
outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:5}
outbox.poll.interval=${OUTBOX_POLL_INTERVAL:10s}
outbox.mongo.ensure-indexes=${OUTBOX_MONGO_ENSURE_INDEXES:false}
async.job-side-effects.enabled=${ASYNC_JOB_SIDE_EFFECTS_ENABLED:false}
async.http-fallback.enabled=${ASYNC_HTTP_FALLBACK_ENABLED:true}
mp.messaging.outgoing.manager-events-out.connector=smallrye-kafka
mp.messaging.outgoing.manager-events-out.topic=${KAFKA_MANAGER_EVENTS_TOPIC:javanc.manager.events}
mp.messaging.outgoing.manager-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.email-commands-out.connector=smallrye-kafka
mp.messaging.outgoing.email-commands-out.topic=${KAFKA_EMAIL_COMMANDS_TOPIC:javanc.email.commands}
mp.messaging.outgoing.email-commands-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.notification-commands-out.connector=smallrye-kafka
mp.messaging.outgoing.notification-commands-out.topic=${KAFKA_NOTIFICATION_COMMANDS_TOPIC:javanc.notification.commands}
mp.messaging.outgoing.notification-commands-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

quarkus.mongodb.database=${MONGODB_DATABASE:microservice-portfolio}
quarkus.mongodb.health.enabled=true

quarkus.http.body.uploads-directory=${MANAGER_UPLOADS_DIR:target/uploads}
quarkus.http.limits.max-body-size=${MANAGER_MAX_BODY_SIZE:10M}

quarkus.rest-client.user-service.connect-timeout=${DOWNSTREAM_CONNECT_TIMEOUT:1000}
quarkus.rest-client.user-service.read-timeout=${DOWNSTREAM_READ_TIMEOUT:3000}
quarkus.rest-client.image-service.connect-timeout=${DOWNSTREAM_CONNECT_TIMEOUT:1000}
quarkus.rest-client.image-service.read-timeout=${DOWNSTREAM_READ_TIMEOUT:3000}
quarkus.rest-client.profile-service.connect-timeout=${DOWNSTREAM_CONNECT_TIMEOUT:1000}
quarkus.rest-client.profile-service.read-timeout=${DOWNSTREAM_READ_TIMEOUT:3000}
quarkus.rest-client.notification-service.connect-timeout=${DOWNSTREAM_CONNECT_TIMEOUT:1000}
quarkus.rest-client.notification-service.read-timeout=${DOWNSTREAM_READ_TIMEOUT:3000}
quarkus.rest-client.email-service.connect-timeout=${DOWNSTREAM_CONNECT_TIMEOUT:1000}
quarkus.rest-client.email-service.read-timeout=${DOWNSTREAM_READ_TIMEOUT:3000}

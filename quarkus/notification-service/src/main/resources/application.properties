quarkus.application.name=notification-service
quarkus.http.port=${NOTIFICATION_SERVICE_PORT:8084}

quarkus.log.console.json.enabled=${LOG_JSON_ENABLED:false}
quarkus.micrometer.export.prometheus.enabled=${METRICS_PROMETHEUS_ENABLED:true}

messaging.enabled=${MESSAGING_ENABLED:false}
kafka.consumer.side-effects.enabled=${KAFKA_CONSUMER_SIDE_EFFECTS_ENABLED:false}
kafka.dlq.enabled=${KAFKA_DLQ_ENABLED:false}
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
quarkus.kafka.devservices.enabled=${KAFKA_DEV_SERVICES_ENABLED:false}
mp.messaging.incoming.notification-commands-in.enabled=${MESSAGING_ENABLED:false}
mp.messaging.incoming.notification-commands-in.connector=smallrye-kafka
mp.messaging.incoming.notification-commands-in.topic=${KAFKA_NOTIFICATION_COMMANDS_TOPIC:javanc.notification.commands}
mp.messaging.incoming.notification-commands-in.group.id=${NOTIFICATION_KAFKA_GROUP_ID:notification-service-group}
mp.messaging.incoming.notification-commands-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.outgoing.notification-commands-dlq-out.enabled=${KAFKA_DLQ_ENABLED:false}
mp.messaging.outgoing.notification-commands-dlq-out.connector=smallrye-kafka
mp.messaging.outgoing.notification-commands-dlq-out.topic=${KAFKA_NOTIFICATION_COMMANDS_DLQ_TOPIC:javanc.notification.commands.dlq}
mp.messaging.outgoing.notification-commands-dlq-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${MYSQL_USERNAME:root}
quarkus.datasource.password=${MYSQL_PASSWORD:}
quarkus.datasource.jdbc.url=${NOTIFICATION_MYSQL_JDBC_URL:jdbc:mysql://localhost:3306/notification1?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false&allowPublicKeyRetrieval=true}
quarkus.hibernate-orm.schema-management.strategy=${NOTIFICATION_DB_GENERATION:update}
quarkus.hibernate-orm.log.sql=${NOTIFICATION_DB_LOG_SQL:false}

services.user.url=${USER_SERVICE_URL:http://localhost:8088}
quarkus.rest-client.user-service.url=${USER_SERVICE_URL:http://localhost:8088}
quarkus.rest-client.user-service.connect-timeout=${DOWNSTREAM_CONNECT_TIMEOUT:1000}
quarkus.rest-client.user-service.read-timeout=${DOWNSTREAM_READ_TIMEOUT:3000}

%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.health.enabled=false
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:notification_service;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.messaging.enabled=false
%test.quarkus.kafka.devservices.enabled=false

quarkus.application.name=user-service
quarkus.http.port=${USER_SERVICE_PORT}

quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${MYSQL_USERNAME}
quarkus.datasource.password=${MYSQL_PASSWORD}
quarkus.datasource.jdbc.url=${USER_MYSQL_JDBC_URL}
quarkus.hibernate-orm.schema-management.strategy=${USER_DB_SCHEMA_STRATEGY:validate}
quarkus.hibernate-orm.log.sql=${USER_DB_LOG_SQL:false}
quarkus.flyway.migrate-at-start=${USER_DB_MIGRATE:true}

quarkus.http.auth.proactive=false
quarkus.http.auth.permission.auth-public.paths=/auth/*
quarkus.http.auth.permission.auth-public.policy=permit
quarkus.http.auth.permission.q-public.paths=/q/*
quarkus.http.auth.permission.q-public.policy=permit
quarkus.http.auth.permission.default.paths=/*
quarkus.http.auth.permission.default.policy=permit

jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:javanc-user-service}
jwt.access-expiration-seconds=${JWT_ACCESS_EXPIRATION_SECONDS:3600}
jwt.refresh-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:604800}

otp.verification.length=${OTP_VERIFICATION_LENGTH:6}
otp.verification.ttl-seconds=${OTP_VERIFICATION_TTL_SECONDS:600}
otp.verification.max-attempts=${OTP_VERIFICATION_MAX_ATTEMPTS:5}
otp.verification.resend-cooldown-seconds=${OTP_VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
otp.hash.secret=${OTP_HASH_SECRET:${JWT_SECRET}}

quarkus.rest-client.email-service.url=${EMAIL_SERVICE_URL:http://localhost:8087}

user.admin.bootstrap.enabled=${USER_ADMIN_BOOTSTRAP_ENABLED:false}
user.admin.email=${USER_ADMIN_EMAIL:}
user.admin.password=${USER_ADMIN_PASSWORD:}
user.admin.name=${USER_ADMIN_NAME:System Admin}

%test.quarkus.datasource.health.enabled=false
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:user_service;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=USER
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.flyway.migrate-at-start=false
%test.jwt.secret=test-secret-key-with-at-least-32-bytes-1234567890
%test.jwt.issuer=javanc-user-service-test
%test.jwt.access-expiration-seconds=3600
%test.jwt.refresh-expiration-seconds=86400
%test.otp.verification.ttl-seconds=600
%test.otp.verification.max-attempts=5
%test.otp.verification.resend-cooldown-seconds=60
%test.otp.hash.secret=test-otp-secret-with-at-least-32-bytes
%test.user.admin.bootstrap.enabled=true
%test.user.admin.email=test.admin@example.com
%test.user.admin.password=Password1!
%test.user.admin.name=Test Admin

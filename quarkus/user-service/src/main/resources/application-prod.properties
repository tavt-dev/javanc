quarkus.log.console.json.enabled=${LOG_JSON_ENABLED:true}
quarkus.micrometer.export.prometheus.enabled=${METRICS_PROMETHEUS_ENABLED:true}

redis.enabled=${REDIS_ENABLED:true}
quarkus.redis.foundation.hosts=${REDIS_URL}
quarkus.redis.foundation.password=${REDIS_PASSWORD}
quarkus.redis.foundation.tls.enabled=${REDIS_SSL:false}
quarkus.redis.health.enabled=${REDIS_ENABLED:true}

messaging.enabled=${MESSAGING_ENABLED:false}
outbox.publisher.enabled=${OUTBOX_PUBLISHER_ENABLED:false}
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
quarkus.kafka.devservices.enabled=${KAFKA_DEV_SERVICES_ENABLED:false}
mp.messaging.outgoing.user-events-out.enabled=${MESSAGING_ENABLED:false}
mp.messaging.outgoing.email-commands-out.enabled=${MESSAGING_ENABLED:false}
mp.messaging.outgoing.notification-commands-out.enabled=${MESSAGING_ENABLED:false}

quarkus.datasource.username=${MYSQL_USERNAME}
quarkus.datasource.password=${MYSQL_PASSWORD}
quarkus.datasource.jdbc.url=${USER_MYSQL_JDBC_URL}
quarkus.hibernate-orm.schema-management.strategy=${USER_DB_SCHEMA_STRATEGY:validate}

quarkus.rest-client.email-service.url=${EMAIL_SERVICE_URL}
quarkus.rest-client.notification-service.url=${NOTIFICATION_SERVICE_URL}

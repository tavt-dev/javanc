quarkus.application.name=image-service
quarkus.http.port=${IMAGE_SERVICE_PORT:8083}
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
quarkus.redis.timeout=${REDIS_TIMEOUT:2s}
quarkus.redis.health.enabled=${REDIS_HEALTH_ENABLED:false}

rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
rate-limit.backend=${RATE_LIMIT_BACKEND:memory}
rate-limit.redis.failure-mode=${RATE_LIMIT_REDIS_FAILURE_MODE:open}
rate-limit.default.capacity=${RATE_LIMIT_DEFAULT_CAPACITY:600}
rate-limit.default.refill-tokens=${RATE_LIMIT_DEFAULT_REFILL_TOKENS:600}
rate-limit.default.refill-period-seconds=${RATE_LIMIT_DEFAULT_REFILL_PERIOD_SECONDS:60}
rate-limit.auth.capacity=${RATE_LIMIT_AUTH_CAPACITY:120}
rate-limit.auth.refill-tokens=${RATE_LIMIT_AUTH_REFILL_TOKENS:120}
rate-limit.auth.refill-period-seconds=${RATE_LIMIT_AUTH_REFILL_PERIOD_SECONDS:60}
rate-limit.upload.capacity=${RATE_LIMIT_UPLOAD_CAPACITY:60}
rate-limit.upload.refill-tokens=${RATE_LIMIT_UPLOAD_REFILL_TOKENS:60}
rate-limit.upload.refill-period-seconds=${RATE_LIMIT_UPLOAD_REFILL_PERIOD_SECONDS:300}
rate-limit.message.capacity=${RATE_LIMIT_MESSAGE_CAPACITY:180}
rate-limit.message.refill-tokens=${RATE_LIMIT_MESSAGE_REFILL_TOKENS:180}
rate-limit.message.refill-period-seconds=${RATE_LIMIT_MESSAGE_REFILL_PERIOD_SECONDS:60}

quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${MYSQL_USERNAME:root}
quarkus.datasource.password=${MYSQL_PASSWORD:}
quarkus.datasource.jdbc.url=${IMAGE_MYSQL_JDBC_URL:jdbc:mysql://localhost:3306/image?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
quarkus.hibernate-orm.schema-management.strategy=${IMAGE_DB_GENERATION:update}
quarkus.hibernate-orm.log.sql=${IMAGE_DB_LOG_SQL:false}

quarkus.http.body.uploads-directory=${IMAGE_UPLOADS_DIR:target/uploads}
quarkus.http.limits.max-body-size=${IMAGE_MAX_BODY_SIZE:10M}
image.local-storage-dir=${IMAGE_LOCAL_STORAGE_DIR:target/uploads/public}
image.public-base-url=${IMAGE_PUBLIC_BASE_URL:http://localhost:8083}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:javanc}

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:image_service_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.log.sql=false
%test.quarkus.datasource.devservices.enabled=false
%test.cloudinary.cloud-name=test-cloud
%test.cloudinary.api-key=test-key
%test.cloudinary.api-secret=test-secret
%test.cloudinary.folder=javanc/test
%test.rate-limit.enabled=false
%test.rate-limit.backend=memory
%test.quarkus.redis.devservices.enabled=false
